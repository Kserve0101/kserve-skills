name: Uti

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Auto-triage/review using GitHub Models API directly.
  # Bypasses opencode's collaborator permission check entirely.
  auto-trigger:
    name: Auto triage/review
    if: |
      github.event.sender.type != 'Bot' && (
        github.event_name == 'issues' ||
        github.event_name == 'pull_request'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      models: read
    steps:
      - name: Generate Uti app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.UTI_APP_ID }}
          private-key: ${{ secrets.UTI_PRIVATE_KEY }}

      - name: Fetch issue/PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"

          if [[ "${{ github.event_name }}" == "issues" ]]; then
            NUMBER="${{ github.event.issue.number }}"
            AUTHOR="${{ github.event.issue.user.login }}"
            EVENT_TYPE="issue"
            gh api "repos/$REPO/issues/$NUMBER" --jq '
              "Issue #\(.number): \(.title)\n\nBody:\n\(.body // "(no body)")\n\nOpened by: @\(.user.login)\nLabels: \([.labels[].name] | if length == 0 then ["none"] else . end | join(", "))"
            ' > /tmp/uti_content.txt
          else
            NUMBER="${{ github.event.pull_request.number }}"
            AUTHOR="${{ github.event.pull_request.user.login }}"
            EVENT_TYPE="pull_request"
            gh api "repos/$REPO/pulls/$NUMBER" --jq '
              "PR #\(.number): \(.title)\n\nBody:\n\(.body // "(no body)")\n\nBy: @\(.user.login) | +\(.additions)/-\(.deletions) in \(.changed_files) files\nBase: \(.base.ref) ← \(.head.ref)"
            ' > /tmp/uti_content.txt
            printf '\n\nDiff:\n' >> /tmp/uti_content.txt
            gh api "repos/$REPO/pulls/$NUMBER" \
              --header "Accept: application/vnd.github.diff" \
              2>/dev/null | head -c 6000 >> /tmp/uti_content.txt
          fi

          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "event_type=$EVENT_TYPE" >> $GITHUB_OUTPUT

      - name: Generate triage/review with AI
        id: ai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTHOR="${{ steps.ctx.outputs.author }}"
          EVENT_TYPE="${{ steps.ctx.outputs.event_type }}"
          CONTENT=$(cat /tmp/uti_content.txt)

          if [[ "$EVENT_TYPE" == "issue" ]]; then
            TASK="Auto-triage this newly opened issue.
Steps:
1. Apply one label: bug, enhancement, question, documentation, or invalid
2. Assess complexity:
   - SIMPLE: typo fix, doc update, small config change, single-file edit with no logic change
   - COMPLEX: logic change, multi-file change, architecture decision, unclear scope
3. If COMPLEX: post clarifying questions. Mention that anyone can reply with /uti answer. Stop.
4. If SIMPLE: describe your proposed approach in 2-3 sentences. Ask a collaborator to trigger /uti continue or /uti fix. Stop."
          else
            TASK="Auto-review this newly opened pull request.
Steps:
1. Read the diff carefully
2. Post a structured review:
   - Summary: 1-2 sentences on what the PR does
   - Findings: each on its own line, severity-tagged (🚨 critical, ⚠️ high, INFO medium/low)
   - For each finding: location, problem, suggested fix
3. Make zero code changes — comment only
4. If no issues found: ✅ and one-sentence summary"
          fi

          SYSTEM="You are Uti (Understand, Think, Implement) — KServe's codebase guardian. Sanskrit: help, protection, kindness. Direct warm teammate, never sycophantic. No 'great question', 'happy to help', 'certainly'. Emoji: 🚨 critical/security ONLY, ⚠️ high severity ONLY, ✅ clean result ONLY. End every response with '— Uti' on its own line."

          # Build request JSON safely
          REQUEST=$(jq -n \
            --arg system "$SYSTEM" \
            --arg task "$TASK" \
            --arg author "$AUTHOR" \
            --arg content "$CONTENT" \
            '{
              "model": "gpt-4o-mini",
              "messages": [
                {"role": "system", "content": $system},
                {"role": "user", "content": ("Start your response by mentioning @" + $author + ".\n\nCURRENT TASK: " + $task + "\n\nCONTENT:\n" + $content)}
              ],
              "max_tokens": 1500
            }')

          curl -sf \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            https://models.inference.ai.azure.com/chat/completions \
            -d "$REQUEST" \
            | jq -r '.choices[0].message.content' > /tmp/uti_response.txt

      - name: Post response as Uti
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue comment "${{ steps.ctx.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat /tmp/uti_response.txt)"

  # Slash command handler using opencode binary.
  # Only runs for human users — opencode permission check passes for collaborators.
  uti:
    name: Uti
    if: |
      github.event.sender.type != 'Bot' && (
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      ) && (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, '/uti') ||
        contains(github.event.comment.body, '@uti-kserve')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check collaborator permission
        id: auth
        run: |
          ASSOCIATION="${{ github.event.comment.author_association }}"
          BODY="${{ github.event.comment.body }}"

          if echo "$BODY" | grep -qiE '(/oc|/opencode|/uti|@uti-kserve) answer'; then
            echo "authorized=true" >> $GITHUB_OUTPUT
          elif [[ "$ASSOCIATION" == "OWNER" || "$ASSOCIATION" == "MEMBER" || "$ASSOCIATION" == "COLLABORATOR" ]]; then
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if unauthorized
        if: steps.auth.outputs.authorized != 'true'
        run: exit 0

      - name: Determine command and model
        id: parse
        run: |
          BODY="${{ github.event.comment.body }}"

          if echo "$BODY" | grep -qiE '(/oc|/opencode|/uti|@uti-kserve) review'; then
            echo "command=review" >> $GITHUB_OUTPUT
          elif echo "$BODY" | grep -qiE '(/oc|/opencode|/uti|@uti-kserve) triage'; then
            echo "command=triage" >> $GITHUB_OUTPUT
          elif echo "$BODY" | grep -qiE '(/oc|/opencode|/uti|@uti-kserve) answer'; then
            echo "command=answer" >> $GITHUB_OUTPUT
          elif echo "$BODY" | grep -qiE '(/oc|/opencode|/uti|@uti-kserve) (fix|continue)'; then
            echo "command=fix" >> $GITHUB_OUTPUT
          else
            echo "command=general" >> $GITHUB_OUTPUT
          fi

          MODEL=$(echo "$BODY" | grep -oP '(?<=--model )\S+' || echo "opencode-go/deepseek-v4-flash")
          echo "model=${MODEL}" >> $GITHUB_OUTPUT

      - name: Generate Uti app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.UTI_APP_ID }}
          private-key: ${{ secrets.UTI_PRIVATE_KEY }}

      - name: Export app token for opencode
        run: echo "TOKEN=${{ steps.app-token.outputs.token }}" >> $GITHUB_ENV

      - name: Build Uti prompt
        id: prompt
        run: |
          COMMAND="${{ steps.parse.outputs.command }}"

          BASE_PERSONA="You are Uti (Understand, Think, Implement) — KServe's codebase guardian.
          Ancient Sanskrit meaning: help, protection, kindness.

          IDENTITY: KServe's codebase guardian. Know this repo deeply. Care about team velocity and product stability equally. You are a teammate, not a tool.

          RESPONSE STRUCTURE:
          - Mention @username of the person who triggered this action
          - If they provided context: react briefly in one line (\"got it\", \"that changes things\", \"makes sense\") before acting
          - If they just triggered a bare command: skip the reaction, go straight to action
          - End every response with \"— Uti\" on its own line — nothing after it

          TONE RULES:
          - Never sycophantic: no \"great question\", \"happy to help\", \"certainly\", \"of course\"
          - Triage / answer / general: friendly teammate — direct, warm, no fuss
          - Non-critical issues found: protective parent — use \"I can't let this through\"
          - Critical or security issues: urgent and firm — lead with 🚨, use must-fix language
          - Fix complete: proud teammate — brief, confident, defer merge decision to human

          EMOJI RULES (strict):
          - 🚨 critical or security issues ONLY
          - ⚠️ high severity warnings ONLY
          - ✅ clean review or fix complete ONLY
          - No other emoji anywhere

          TRIGGER COMMANDS TO REFERENCE WHEN RELEVANT:
          - /uti answer — anyone can use this to answer clarifying questions
          - /uti fix — collaborators use to trigger implementation
          - /uti continue — collaborators use to confirm and proceed"

          case "$COMMAND" in
            review)
              PROMPT="$BASE_PERSONA

          CURRENT TASK: Manual PR review triggered by a collaborator.
          Read the diff, post structured findings with severity tags, make zero code changes.
          If no issues: ✅ and brief summary.
          Start your response by mentioning @username (the collaborator who triggered this)."
              ;;
            triage)
              PROMPT="$BASE_PERSONA

          CURRENT TASK: Manual triage triggered on an existing issue.
          Apply a label, assess complexity, ask clarifying questions if complex, post proposed approach if simple.
          Start your response by mentioning @username (the collaborator who triggered this)."
              ;;
            answer)
              PROMPT="$BASE_PERSONA

          CURRENT TASK: A user has provided answers to your clarifying questions.
          Steps:
          1. Read their answers carefully
          2. Acknowledge what changed or was clarified — one line maximum
          3. If you have enough context: state your updated approach clearly, then ask a collaborator to trigger /uti continue or /uti fix
          4. If you still need more info: ask one or two focused follow-up questions only
          Start your response by mentioning @username (the person who answered)."
              ;;
            fix)
              PROMPT="$BASE_PERSONA

          CURRENT TASK: Implement the fix.
          HARD CONSTRAINTS:
          - Only allowed changes: typos, formatting, documentation updates, small config values
          - Forbidden: logic changes, algorithm changes, architectural changes, new features
          - If the fix requires anything forbidden: explain clearly why you cannot proceed, describe what human decision is needed, and stop — do not implement
          - Branch name: opencode/fix-[issue-number] or opencode/fix-[short-description]
          - Open a DRAFT pull request — never merge, never request review
          - PR description: factual only — what changed and why, nothing else
          Start your response by mentioning @username (the collaborator who triggered this)."
              ;;
            *)
              PROMPT="$BASE_PERSONA

          CURRENT TASK: General request — no specific constraint.
          Read the comment carefully and respond as Uti — helpful, direct, no fuss.
          Start your response by mentioning @username if relevant."
              ;;
          esac

          echo "prompt<<PROMPT_EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "PROMPT_EOF" >> $GITHUB_OUTPUT

      - name: Run opencode as Uti
        uses: anomalyco/opencode/github@latest
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          model: ${{ steps.parse.outputs.model }}
          variant: high
          use_github_token: "true"
          mentions: "/oc,/opencode,/uti,@uti-kserve"
          prompt: ${{ steps.prompt.outputs.prompt }}
